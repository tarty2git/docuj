<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} + ' - Security Portal'">Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        .login-card {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .form-control {
            background-color: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 8px;
        }
        .form-control:focus {
            background-color: rgba(255,255,255,0.15);
            color: white;
            border-color: #00adb5;
            box-shadow: 0 0 0 0.25rem rgba(0, 173, 181, 0.25);
        }
        .btn-cyan {
            background-color: #00adb5;
            color: white;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-cyan:hover {
            background-color: #008f95;
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="mb-4">
            <i class="fa-solid fa-file-shield fa-4x text-info mb-2"></i>
            <h2 class="fw-bold m-0" th:text="${title}">DocProcessor</h2>
            <small class="text-info" th:text="'Version ' + ${version} + ' | ' + ${documentCode}">v1.0.0</small>
        </div>

        <!-- Success Messages -->
        <div class="alert alert-success py-2 fs-6 text-dark" role="alert" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-success py-2 fs-6 text-dark" role="alert" th:if="${logoutMessage}" th:text="${logoutMessage}"></div>

        <!-- Error Messages -->
        <div class="alert alert-danger py-2 fs-6 text-dark" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <!-- Login Form -->
        <form action="/login" method="post" class="text-start">
            <div class="mb-3">
                <label for="username" class="form-label text-white-50"><i class="fa-solid fa-user me-1"></i>Username</label>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Enter username">
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-white-50"><i class="fa-solid fa-lock me-1"></i>Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-cyan w-100 py-2.5 mb-3"><i class="fa-solid fa-right-to-bracket me-2"></i>Sign In</button>
        </form>

        <div class="text-white-50 mt-4 small border-top pt-3 border-secondary d-flex justify-content-between">
            <span>New here? <a href="/register" class="text-info fw-bold">Create Account</a></span>
            <span class="text-muted" th:text="${ldapEnabled} ? 'LDAP AUTH ENABLED' : 'LOCAL DB AUTH'"></span>
        </div>
    </div>

</body>
</html>
