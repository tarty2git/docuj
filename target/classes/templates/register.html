<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} + ' - Portal Enrollment'">Create Account</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        .login-card {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .form-control {
            background-color: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 8px;
        }
        .form-control:focus {
            background-color: rgba(255,255,255,0.15);
            color: white;
            border-color: #00adb5;
            box-shadow: 0 0 0 0.25rem rgba(0, 173, 181, 0.25);
        }
        .btn-cyan {
            background-color: #00adb5;
            color: white;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-cyan:hover {
            background-color: #008f95;
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="mb-4">
            <i class="fa-solid fa-user-plus fa-4x text-info mb-2"></i>
            <h2 class="fw-bold m-0">Create Account</h2>
            <p class="text-white-50 small mt-1" th:text="${title}">DocProcessor</p>
        </div>

        <div class="alert alert-danger py-2 fs-6 text-dark" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <!-- Enrollment Form -->
        <form action="/register" method="post" class="text-start">
            <div class="mb-3">
                <label for="username" class="form-label text-white-50"><i class="fa-solid fa-user me-1"></i>Username</label>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Choose a username">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label text-white-50"><i class="fa-solid fa-envelope me-1"></i>Email Address</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="user@company.com">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label text-white-50"><i class="fa-solid fa-lock me-1"></i>Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                <div class="form-text text-white-50" style="font-size: 0.75rem;">
                    Min 8 characters, at least 1 uppercase, 1 digit, and 1 special symbol (@#$%^&+=!).
                </div>
            </div>

            <div class="mb-4">
                <label for="role" class="form-label text-white-50"><i class="fa-solid fa-shield me-1"></i>Role Authority</label>
                <select name="role" id="role" class="form-select bg-dark text-white border-secondary">
                    <option value="ROLE_USER">Regular Operator (ROLE_USER)</option>
                    <option value="ROLE_ADMIN">Administrator (ROLE_ADMIN)</option>
                </select>
            </div>

            <button type="submit" class="btn btn-cyan w-100 py-2.5 mb-3"><i class="fa-solid fa-user-check me-2"></i>Register Profile</button>
        </form>

        <div class="text-white-50 mt-4 small border-top pt-3 border-secondary text-center">
            Already registered? <a href="/login" class="text-info fw-bold">Sign In here</a>
        </div>
    </div>

</body>
</html>
