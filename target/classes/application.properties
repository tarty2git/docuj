# Default configuration (H2 Memory Database for demo & quick start)
spring.application.name=doc-processor
spring.profiles.active=h2

# Configurable app defaults (can be overridden dynamically in system settings DB)
app.defaults.title=Enterprise Document Intelligence System
app.defaults.description=A robust document metadata parser and viewer supporting Word, Excel, and PowerPoint files with fine-grained security and administration control.
app.defaults.version=3.4.12
app.defaults.document-code=DOC-INT-2025-A

# LDAP Config (defaults to disabled, local DB validation)
ldap.enabled=false
ldap.url=ldap://localhost:389
ldap.base-dn=dc=example,dc=com
ldap.user-dn-pattern=uid={0},ou=people

# File Upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Enable OpenAPI docs path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security console frames enable (for H2 console if needed)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
